<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆圈 -->
  <circle cx="60" cy="60" r="60" fill="#E8F4FD" stroke="#B3D9F2" stroke-width="2"/>
  
  <!-- 鹅身体 -->
  <ellipse cx="60" cy="70" rx="25" ry="18" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  
  <!-- 鹅头部 -->
  <ellipse cx="60" cy="45" rx="18" ry="15" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  
  <!-- 鹅嘴巴 -->
  <ellipse cx="68" cy="48" rx="8" ry="4" fill="#FFA726" stroke="#FF8F00" stroke-width="1"/>
  
  <!-- 鹅眼睛 -->
  <circle cx="55" cy="42" r="3" fill="#333333"/>
  <circle cx="65" cy="42" r="3" fill="#333333"/>
  <circle cx="56" cy="41" r="1" fill="#FFFFFF"/>
  <circle cx="66" cy="41" r="1" fill="#FFFFFF"/>
  
  <!-- 金币符号在胸前 -->
  <circle cx="60" cy="65" r="8" fill="#FFD700" stroke="#FFC107" stroke-width="1"/>
  <text x="60" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FF8F00">¥</text>
  
  <!-- 鹅翅膀 -->
  <ellipse cx="45" cy="60" rx="8" ry="12" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1" transform="rotate(-20 45 60)"/>
  <ellipse cx="75" cy="60" rx="8" ry="12" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1" transform="rotate(20 75 60)"/>
  
  <!-- 装饰性元素 - 小星星表示财富增长 -->
  <polygon points="25,25 27,30 32,30 28,33 30,38 25,35 20,38 22,33 18,30 23,30" fill="#FFD700" opacity="0.8"/>
  <polygon points="90,30 91,33 94,33 92,35 93,38 90,36 87,38 88,35 86,33 89,33" fill="#FFD700" opacity="0.6"/>
  <polygon points="95,75 96,77 98,77 97,78 97,80 95,79 93,80 94,78 93,77 95,77" fill="#FFD700" opacity="0.7"/>
</svg>
